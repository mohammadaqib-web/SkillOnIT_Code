<!doctype html>

    <meta charset="UTF-8" />

  </head>
  <body>
    <div id="main">
      <div id="left">
        <h1 id="form-heading">Create New Profile</h1>
        <p>Fill in the details to add a new user profile.</p>

        <form>
          <label for="name">Full Name</label>
          <br />
          <input type="text" placeholder="Enter full name" id="name" />

          <br />
          <br />
          <label for="age">Age</label>
          <br />
          <input type="number" placeholder="Enter age" id="age" />

          <br />
          <br />
          <label for="profession">Profession</label>
          <br />
          <input type="text" placeholder="Enter profession" id="profession" />

          <br />
          <br />
          <label for="city">City</label>
          <br />
          <input type="text" placeholder="Enter city" id="city" />

          <br />
          <br />
          <label for="image">Profile Image URL</label>
          <br />
          <input type="text" placeholder="Enter image url" id="image" />

          <br />
          <br />
          <label for="bio">Bio</label>
          <br />
          <textarea
            rows="5"
            id="bio"
            placeholder="Write a short bio about the user..."
          ></textarea>

          <br />
          <br />
          <button id="submit">Add Profile</button>
          <br />
          <br />
          <button type="reset" id="reset">Reset Form</button>
        </form>
      </div>
      <div id="right">
        <div id="navbar">
          <div>
            <h1>All Profiles</h1>
            <p>Here are all the user profiles you've created</p>
          </div>
          <div id="nav-right">
            <p id="all-profiles">All Profiles: 5</p>
            <button id="clear">Clear All</button>
          </div>
        </div>
