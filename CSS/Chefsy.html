<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .nav-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        /* background-color: red; */
        margin: 10px 20px;
      }
      ul {
        display: flex;
        /* justify-content: space-between; */
        align-items: center;
      }
      li {
        margin-right: 20px;
      }
      .menu-items {
        font-size: 1.2rem;
      }
      select {
        padding: 10px;
        border-radius: 20px;
        width: 200px;
        border: 1px solid rgba(0, 0, 0, 0.347);
      }
      .bottom {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 20px;
      }
      input {
        padding: 10px;
        border-radius: 20px;
        border: 1px solid rgba(0, 0, 0, 0.347);
      }
      button {
        width: 100px;
        border-radius: 20px;
        border: none;
        font-weight: bold;
        cursor: pointer;
      }
      .banner {
        background-image: url("https://images.unsplash.com/photo-1586208958839-06c17cacdf08?q=80&w=965&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D");
        height: 70vh;
        margin-top: 30px;
        background-position: left;
        text-align: center;
        position: relative;
        display: flex;
        flex-direction: column;
        /* justify-content: center; */
        align-items: center;
      }
      .banner-text {
        font-size: 4rem;
        /* color: rgba(52, 139, 66, 0.79); */
      }
      .CTA-btn {
        padding: 15px;
        width: 150px;
        border-radius: 30px;
        font-size: 1.2rem;
        /* margin-top: 100px; */
        position: absolute;
        bottom: 0;
        margin-bottom: 10px;
      }
      .user-info{
        width: 200px;
        background-color: rgba(255, 255, 255, 0.31);
        position: absolute;
        bottom: 0;
        border-radius: 10px;
        margin-left: 20px;
        padding: 20px 30px;
        backdrop-filter: blur(5px);
      }
      .banner-section{
        position: relative;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <nav class="nav-top">
        <div>
          <img
            src="https://static.vecteezy.com/system/resources/thumbnails/078/346/075/small/minimalist-hamburger-menu-icon-symbol-sign-shape-element-vector.jpg"
            alt="menu icon"
            width="50px"
          />
        </div>
        <div>
          <h1>Chefsy</h1>
        </div>
        <div>
          <ul type="none">
            <li class="menu-items">About</li>
            <li class="menu-items">FAQ</li>
            <li>
              <img
                src="https://assets.streamlinehq.com/image/private/w_300,h_300,ar_1/f_auto/v1/icons/all-3/shopping-cart-9xhllmo2cb79djc9j7b5kb.png/shopping-cart-pe974q2wd8bzu5cueg3qr.png?_a=DATAiZAAZAA0"
                alt="shopping cart icon"
                width="24px"
              />
            </li>
          </ul>
        </div>
      </nav>

      <div class="bottom">
        <select name="Categories" id="">
          <option value="">Men</option>
          <option value="">Women</option>
          <option value="">Boy</option>
          <option value="">Girl</option>
        </select>
        <select name="New Product" id="">
          <option value="">Jeans</option>
          <option value="">Shirts</option>
        </select>
        <input type="search" placeholder="Search products" />
        <button>Men</button>
        <button>Women</button>
        <button>Boy</button>
        <button>Girl</button>
      </div>
    </div>

    <div class="banner-section">
    <div class="banner">
      <h1 class="banner-text">
        Smart Kitchen <br />
        Delicious Results.
      </h1>
      <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. At, placeat
        autem.
      </p>
      <button class="CTA-btn">Shop Now</button>
    </div>

    <div class="user-info">
      <h3>12 Million+</h3>
      <p>
        Lorem ipsum, dolor sit amet consectetur adipisicing elit. Assumenda id
        neque totam eveniet maiores vitae laboriosam veritatis vel.
      </p>
    </div>
    </div>
  </body>
</html>
