<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #box {
        height: 200px;
        width: 200px;
        background-color: red;
        /* background-image: url(""); */
        
        border-radius: 50%;
      }
      img{
        height: 200px;
        width: 200px;
        animation: moveBox 1s infinite;
      }
      @keyframes moveBox {
        0% {
          transform: scale(1)
        }
        100% {
          transform: scale(1.1)
        }
      }
    </style>
  </head>
  <body>
    <div id="box">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcShH1kez-kvXWmTeHsOyUMAUWWQndwICdvCRFIxMBFFOQ&s=10" alt="">
    </div>
  </body>
</html>
