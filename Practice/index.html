<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
  </head>
  <body>
    <table border="1" cellspacing="2" cellpadding="1">
      <tr>
        <th>Time</th>
        <th>Monday</th>
        <th>Tuesday</th>
        <th>Wednesday</th>
        <th>Thursday</th>
        <th>Friday</th>
      </tr>
      <tr>
        <td>9 am</td>
        <td colspan="2">Maths</td>
        <td rowspan="2">Art</td>
        <td>GYM</td>
        <td>Running</td>
      </tr>
      <tr>
        <td>10 am</td>
        <td colspan="2">Science</td>
        <td colspan="2">Science</td>
      </tr>
      <tr>
        <td>11 am</td>
        <td colspan="5">Lunch</td>
      </tr>
      <tr>
        <td>12 pm</td>
        <td colspan="2">Music</td>
        <td>Writing</td>
        <td colspan="2">History</td>
      </tr>
      <tr>
        <td>1 pm</td>
        <td colspan="2">Free</td>
        <td colspan="3">Computer</td>
      </tr>
    </table>
  </body>
</html>
